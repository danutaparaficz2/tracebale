[project]
name = "tracebale"
version = "0.1.0"
description = "Segment an image (Segment Anything) and recognise which component each segment is (CLIP zero-shot)."
requires-python = ">=3.9"
dependencies = ["numpy", "pillow", "pillow-heif", "torch", "torchvision", "transformers"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tracebale = "sam_clip_pipeline.cli:main"

[tool.setuptools]
packages = ["sam_clip_pipeline"]
